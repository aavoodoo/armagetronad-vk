plugins {
    id 'com.android.application'
}

android {
    namespace = "org.armagetronad.game"
    compileSdkVersion 35
    ndkVersion = "30.0.14904198"

    defaultConfig {
        applicationId "org.armagetronad.game"
        minSdkVersion 26      // Android 8.0; guarantees Vulkan 1.0
        targetSdkVersion 35
        versionCode 1
        versionName "0.4.0"

        externalNativeBuild {
            cmake {
                arguments "-DANDROID_PLATFORM=android-26",
                          "-DANDROID_STL=c++_static",
                          "-DSDL3_SOURCE_DIR=/Users/emmanuelrollet/dev/src/SDL3"
                abiFilters 'arm64-v8a', 'x86_64'
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
        debug {
            jniDebuggable true
        }
    }

    externalNativeBuild {
        cmake {
            path 'src/main/jni/CMakeLists.txt'
            version '3.22.1'
        }
    }

    sourceSets.main {
        assets.srcDirs = ['src/main/assets']
    }

    lint {
        abortOnError = false
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
}
