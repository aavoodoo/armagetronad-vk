plugins {
    id 'com.android.application'
}

// ---------------------------------------------------------------------------
// syncAndroidResources
//   Regenerates resource/included/ (from resource/proto/ + resource/binary/)
//   and _manifest.txt before every build.  Runs incrementally — Gradle
//   skips it when no input has changed and both outputs are up-to-date.
// ---------------------------------------------------------------------------
def repoRoot = project.rootDir.parentFile   // android/ → repo root
def scriptFile = file("${repoRoot}/tools/sync_assets.sh")
def protoDir   = file("${repoRoot}/resource/proto")
def binaryDir  = file("${repoRoot}/resource/binary")
def assetsDir  = file("${projectDir}/src/main/assets")

task syncAndroidResources {
    description 'Regenerate resource/included/ and _manifest.txt from proto/ + binary/'
    group 'build'

    inputs.file  scriptFile
    inputs.dir   protoDir
    // fileTree is empty (no-op) when binary/ doesn't exist — safe to declare
    inputs.files fileTree(dir: binaryDir)
    outputs.dir  "${assetsDir}/resource/included"
    outputs.file "${assetsDir}/_manifest.txt"

    doLast {
        exec {
            workingDir repoRoot
            commandLine 'bash', 'tools/sync_assets.sh', 'android-resources'
        }
    }
}

preBuild.dependsOn syncAndroidResources

// Read local.properties for dependency paths (sdl3.dir, protobuf.dir)
def localProps = new Properties()
def localPropsFile = rootProject.file("local.properties")
if (localPropsFile.exists()) {
    localProps.load(new FileInputStream(localPropsFile))
}

def sdl3Dir = localProps.getProperty('sdl3.dir', System.getenv('SDL3_SOURCE_DIR') ?: '')
def protobufDir = localProps.getProperty('protobuf.dir', System.getenv('PROTOBUF_SOURCE_DIR') ?: '')

android {
    namespace = "org.armagetronad.game"
    compileSdkVersion 35
    ndkVersion = "30.0.14904198"

    defaultConfig {
        applicationId "org.armagetronad.game"
        minSdkVersion 26      // Android 8.0; guarantees Vulkan 1.0
        targetSdkVersion 35
        versionCode 1
        versionName "0.4.0"

        externalNativeBuild {
            cmake {
                def cmakeArgs = [
                    "-DANDROID_PLATFORM=android-26",
                    "-DANDROID_STL=c++_static"
                ]
                if (sdl3Dir) cmakeArgs.add("-DSDL3_SOURCE_DIR=${sdl3Dir}")
                if (protobufDir) cmakeArgs.add("-DPROTOBUF_SOURCE_DIR=${protobufDir}")
                arguments(*cmakeArgs)
                abiFilters 'arm64-v8a', 'x86_64'
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
        debug {
            jniDebuggable true
        }
    }

    externalNativeBuild {
        cmake {
            path 'src/main/jni/CMakeLists.txt'
            version '3.22.1'
        }
    }

    sourceSets.main {
        assets.srcDirs = ['src/main/assets']
    }

    lint {
        abortOnError = false
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
}
